# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

# ============================================================
# MASTER-NODE (RS-485-bus → MQTT → Home Assistant)
#
# Pollt om beurt elk lokaal (slave) via de RS-485-bus en stuurt
# de ontvangen sensordata via MQTT door naar Home Assistant.
# Elk lokaal verschijnt automatisch als apparaat "Lokaal Pxxx".
#
# AAN TE PASSEN BIJ EEN NIEUWE MASTER:
#   name / friendly_name : nummer van de master, bv. master1 / Master1
#                          (name enkel kleine letters)
#   lokalen              : lijst met lokalen op deze bus, gescheiden
#                          door komma's. Elk nummer moet exact gelijk
#                          zijn aan lokaal in de slave van dat lokaal.
#   mqtt → broker        : IP-adres van de MQTT-broker (Home Assistant).
#                          Verandert als je van netwerk wisselt!
#
# INSTELLINGEN:
#   poll_timeout : hoe lang (ms) de master op een antwoord wacht.
#                  Verhogen als je vaak "geen antwoord" ziet bij
#                  lange berichten.
#   poll_gap     : pauze (ms) tussen twee polls.
#
# BEDRADING RS-485-module (MAX3485):
#   GPIO17 = RO (RX) | GPIO18 = DI (TX) | GPIO16 = DE/RE
#
# BEDRADING STATUS-LED:
#   GPIO48 = ingebouwde NeoPixel (WS2812)
#
# STATUS-LED (ingebouwde NeoPixel op GPIO48):
#   Groen  = alles werkt
#   Oranje = flits bij versturen van een PULL
#   Paars  = flits bij ontvangen van een geldig antwoord
#   Rood   = systeemfout: geen MQTT-verbinding of 10 s lang
#            geen enkel lokaal dat antwoordt
#
# DATA:
#   Topic in MQTT : gebouw/<lokaal>/state
#   Inhoud        : {"co2":616,"temp":22.1,"hum":45.3}
# ============================================================

substitutions:
  name: master1
  friendly_name: Master1
  lokalen: "P320,P321"
  poll_timeout: "150"
  poll_gap: "500"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            // Slavelijst uit de tekst halen
            std::string list = "${lokalen}";
            size_t start = 0;
            while (start <= list.size()) {
              size_t end = list.find(',', start);
              if (end == std::string::npos) end = list.size();
              std::string sid = list.substr(start, end - start);
              sid.erase(0, sid.find_first_not_of(' '));
              sid.erase(sid.find_last_not_of(' ') + 1);
              if (!sid.empty()) id(lokalens).push_back(sid);
              start = end + 1;
            }
            ESP_LOGI("rs485", "%d slave(s) geconfigureerd", (int) id(lokalens).size());
    # STATUS-LED: groen bij opstarten
    - priority: -100
      then:
        - script.execute: led_base

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "EIGEN_SLEUTEL_VAN_DEZE_SLAVE"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


captive_portal:
mqtt:
  id: mqtt_client
  broker: 10.127.246.213
  username: mqtt_user
  password: mqtt_user

uart:
  - id: rs485_uart
    baud_rate: 9600
    rx_pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
    tx_pin: GPIO18
    flow_control_pin: GPIO16

# STATUS-LED
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

# STATUS-LED
script:
  # Basiskleur: groen als alles goed is, rood bij een fout
  - id: led_base
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(sys_error);'
          then:
            - light.turn_on:
                id: status_led
                red: 100%
                green: 0%
                blue: 0%
                brightness: 30%
          else:
            - light.turn_on:
                id: status_led
                red: 0%
                green: 100%
                blue: 0%
                brightness: 30%

  # Korte flits in een kleur, daarna terug naar de basiskleur
  - id: led_flash
    mode: restart
    parameters:
      r: float
      g: float
      b: float
    then:
      - light.turn_on:
          id: status_led
          red: !lambda 'return r;'
          green: !lambda 'return g;'
          blue: !lambda 'return b;'
          brightness: 30%
      - delay: 100ms
      - script.execute: led_base

globals:
  - id: lokalens
    type: std::vector<std::string>
  - id: discovered
    type: std::vector<std::string>
  - id: poll_index
    type: int
    initial_value: '0'
  - id: current_slave
    type: std::string
    initial_value: '""'
  - id: waiting
    type: bool
    initial_value: 'false'
  - id: poll_time
    type: uint32_t
    initial_value: '0'
  - id: rx_buffer
    type: std::string
    initial_value: '""'
  - id: in_message
    type: bool
    initial_value: 'false'
  # STATUS-LED
  - id: sys_error
    type: bool
    initial_value: 'false'
  - id: last_ok
    type: uint32_t
    initial_value: '0'

interval:
  - interval: 10ms
    then:
      - lambda: |-
          auto &lokalen = id(lokalens);
          uint32_t now = millis();

          // Lokaal één keer aankondigen bij Home Assistant (MQTT discovery)
          auto announce = [&](const std::string &sid) {
            struct Field { const char *key; const char *name; const char *unit; const char *cls; };
            const Field fields[] = {
              {"co2",  "CO2",              "ppm", "carbon_dioxide"},
              {"temp", "Temperatuur",      "°C",  "temperature"},
              {"hum",  "Luchtvochtigheid", "%",   "humidity"},
            };
            // Template opgesplitst zodat ESPHome er niet aan komt
            const std::string open = "{" "{";
            const std::string close = "}" "}";
            for (auto &f : fields) {
              std::string topic = "homeassistant/sensor/bus_" + sid + "_" + f.key + "/config";
              std::string cfg = std::string("{") +
                "\"name\":\"" + f.name + "\"," +
                "\"uniq_id\":\"bus_" + sid + "_" + f.key + "\"," +
                "\"stat_t\":\"gebouw/" + sid + "/state\"," +
                "\"val_tpl\":\"" + open + " value_json." + f.key + " " + close + "\"," +
                "\"unit_of_meas\":\"" + f.unit + "\"," +
                "\"dev_cla\":\"" + f.cls + "\"," +
                "\"stat_cla\":\"measurement\"," +
                "\"dev\":{\"ids\":[\"bus_" + sid + "\"],\"name\":\"Lokaal " + sid + "\"}" +
                "}";
              id(mqtt_client).publish(topic, cfg, 0, true);
            }
            ESP_LOGI("mqtt", "Lokaal %s aangekondigd bij Home Assistant", sid.c_str());
          };

          // 1. Binnenkomende bytes lezen
          while (id(rs485_uart).available()) {
            uint8_t c;
            if (!id(rs485_uart).read_byte(&c)) break;

            if (c == '$') {
              id(rx_buffer).clear();
              id(in_message) = true;
            } else if (c == '\n' || c == '\r') {
              if (id(in_message) && !id(rx_buffer).empty()) {
                std::string msg = id(rx_buffer);
                size_t sep = msg.find(':');
                std::string from = msg.substr(0, sep);
                std::string payload = (sep == std::string::npos) ? "" : msg.substr(sep + 1);

                if (id(waiting) && from == id(current_slave)) {
                  ESP_LOGI("rs485", "[%s] %s (%u ms)",
                           from.c_str(), payload.c_str(), (unsigned) (now - id(poll_time)));
                  id(waiting) = false;
                  id(poll_time) = now;

                  // STATUS-LED: paars bij geldig antwoord
                  id(last_ok) = now;
                  id(led_flash).execute(0.6, 0.0, 1.0);

                  // Doorsturen naar Home Assistant
                  if (id(mqtt_client).is_connected() && !payload.empty() && payload[0] == '{') {
                    auto &d = id(discovered);
                    bool known = false;
                    for (auto &s : d) if (s == from) known = true;
                    if (!known) {
                      announce(from);
                      d.push_back(from);
                    }
                    id(mqtt_client).publish("gebouw/" + from + "/state", payload, 0, true);
                  }
                } else {
                  ESP_LOGW("rs485", "Onverwacht bericht: %s", msg.c_str());
                }
              }
              id(rx_buffer).clear();
              id(in_message) = false;
            } else if (id(in_message) && c >= 0x20 && c <= 0x7E && id(rx_buffer).size() < 256) {
              id(rx_buffer).push_back((char) c);
            }
          }

          // 2. Timeout: slave antwoordt niet
          if (id(waiting) && now - id(poll_time) > ${poll_timeout}) {
            ESP_LOGW("rs485", "[%s] geen antwoord", id(current_slave).c_str());
            id(waiting) = false;
            id(poll_time) = now;
          }

          // 3. Volgende slave aanspreken
          if (!id(waiting) && !lokalen.empty() && now - id(poll_time) >= ${poll_gap}) {
            id(current_slave) = lokalen[id(poll_index)];
            id(poll_index) = (id(poll_index) + 1) % lokalen.size();

            std::string out = "PULL " + id(current_slave) + "\n";
            id(rs485_uart).write_array(
                reinterpret_cast<const uint8_t *>(out.c_str()), out.size());
            id(rs485_uart).flush();

            // STATUS-LED: oranje bij versturen
            id(led_flash).execute(1.0, 0.35, 0.0);

            id(waiting) = true;
            id(poll_time) = millis();
          }

  # STATUS-LED: om de seconde controleren op een systeemfout
  - interval: 1s
    then:
      - lambda: |-
          if (millis() < 30000) return;   // opstarttijd
          bool err = !id(mqtt_client).is_connected() ||
                     (millis() - id(last_ok) > 10000);
          if (err != id(sys_error)) {
            id(sys_error) = err;
            if (err) ESP_LOGE("status", "Systeemfout: geen MQTT of geen enkel lokaal antwoordt");
            else ESP_LOGI("status", "Systeem terug OK");
            id(led_base).execute();
          }