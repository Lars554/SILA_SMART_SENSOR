# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

# ============================================================
# SLAVE-NODE (sensoren → RS-485-bus → master)
#
# Meet CO2, temperatuur en luchtvochtigheid met een SCD30 en
# antwoordt op de bus als de master "PULL <lokaal>" stuurt.
#
# AAN TE PASSEN BIJ EEN NIEUWE SLAVE:
#   name          : naam in ESPHome, enkel kleine letters,
#                   bv. lokaalp105
#   friendly_name : leesbare naam, bv. Lokaal P105
#   lokaal        : nummer van het lokaal, bv. P105.
#                   Moet EXACT (ook hoofdletters) gelijk zijn aan
#                   een nummer in "lokalen" van de master.
#
# BEDRADING:
#   RS-485-module (MAX3485):
#     GPIO42 = RO (RX) | GPIO12 = DI (TX) | GPIO41 = DE/RE
#   SCD30 (I2C, adres 0x61):
#     GPIO9 = SDA | GPIO8 = SCL
#
# PROTOCOL:
#   Ontvangt : PULL <lokaal>
#   Antwoord : 16 opvulbytes (0xFF) + $<lokaal>:{"co2":616,"temp":22.1,"hum":45.3}
#   Zolang de SCD30 nog geen meting heeft, staat er null.
# ============================================================

substitutions:
  name: lokaalp105
  friendly_name: Lokaal P105
  lokaal: P105

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: UART0

# Laat hier de api-, ota- en wifi-regels staan die ESPHome voor deze slave aanmaakte
api:
  encryption:
    key: "EIGEN_SLEUTEL_VAN_DEZE_SLAVE"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  - id: rs485_uart
    baud_rate: 9600
    rx_pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
    tx_pin: GPIO18
    flow_control_pin: GPIO16

i2c:
  - id: i2c_1
    scl: GPIO8
    sda: GPIO9

sensor:
  - platform: scd30
    id: sensor_scd30_1
    i2c_id: i2c_1
    update_interval: 5s
    co2:
      name: CO2
      id: sensor_scd30_1_co2
    humidity:
      name: Humidity
      id: sensor_scd30_1_humidity
    temperature:
      name: Temperature
      id: sensor_scd30_1_temperature

interval:
  # Testmelding om de 5 seconden
  - interval: 5s
    then:
      - logger.log:
          level: INFO
          tag: "rs485"
          format: "TEST: slave ${lokaal} draait en wacht op PULL"

  # Bus uitlezen en antwoorden op PULL
  - interval: 10ms
    then:
      - lambda: |-
          static std::string buffer;
          const std::string command = "PULL ${lokaal}";

          while (id(rs485_uart).available()) {
            uint8_t c;
            if (!id(rs485_uart).read_byte(&c)) break;

            if (c == '\n' || c == '\r') {
              // Eindigt de buffer op ons commando? (rommel ervoor wordt genegeerd)
              bool match = buffer.size() >= command.size() &&
                           buffer.compare(buffer.size() - command.size(),
                                          command.size(), command) == 0;

              if (match) {
                ESP_LOGI("rs485", "PULL ontvangen van master");

                // Sensorwaarden ophalen (null als er nog geen meting is)
                auto fmt = [](float v, int dec, char *out, size_t n) {
                  if (std::isnan(v)) snprintf(out, n, "null");
                  else snprintf(out, n, "%.*f", dec, v);
                };
                char co2[16], temp[16], hum[16];
                fmt(id(sensor_scd30_1_co2).state, 0, co2, sizeof(co2));
                fmt(id(sensor_scd30_1_temperature).state, 1, temp, sizeof(temp));
                fmt(id(sensor_scd30_1_humidity).state, 1, hum, sizeof(hum));

                char payload[128];
                snprintf(payload, sizeof(payload),
                         "{\"co2\":%s,\"temp\":%s,\"hum\":%s}", co2, temp, hum);

                delay(5);

                // Preambule zodat de master in sync komt
                uint8_t preamble[16];
                memset(preamble, 0xFF, sizeof(preamble));
                id(rs485_uart).write_array(preamble, sizeof(preamble));

                // Bericht: $ID:payload   ($$ wordt in ESPHome een gewone $)
                std::string msg = std::string("$$") + "${lokaal}:" + payload + "\n";
                id(rs485_uart).write_array(
                    reinterpret_cast<const uint8_t *>(msg.c_str()), msg.size());
                id(rs485_uart).flush();

                ESP_LOGI("rs485", "Verstuurd: ${lokaal}:%s", payload);

                // Rommel van eigen zendmoment weggooien
                while (id(rs485_uart).available()) {
                  uint8_t d;
                  id(rs485_uart).read_byte(&d);
                }
              }
              buffer.clear();
            } else if (c >= 0x20 && c <= 0x7E && buffer.size() < 64) {
              buffer.push_back((char) c);
            }
          }